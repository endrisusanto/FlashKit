name: Release FlashKit

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      version:
        description: Custom version, optional. Example 1.9.0
        required: false
        type: string
      draft:
        description: Create release as draft
        type: boolean
        default: false
      prerelease:
        description: Mark release as prerelease
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

jobs:
  bump-version:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.bump.outputs.tag_name }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bow-rust/package-lock.json
      - name: bump app version
        id: bump
        working-directory: ./bow-rust
        run: node scripts/bump-version.mjs --type "${{ inputs.bump }}" --version "${{ inputs.version }}"
      - name: commit version and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bow-rust/package.json bow-rust/package-lock.json bow-rust/src-tauri/Cargo.toml bow-rust/src-tauri/Cargo.lock bow-rust/src-tauri/tauri.conf.json
          git commit -m "chore(release): v${{ steps.bump.outputs.version }}"
          git tag -a "${{ steps.bump.outputs.tag_name }}" -m "FlashKit ${{ steps.bump.outputs.tag_name }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "${{ steps.bump.outputs.tag_name }}"

  create-release:
    needs: bump-version
    if: always() && (github.event_name == 'push' || needs.bump-version.result == 'success')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: create release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event_name == 'push' && false || inputs.draft }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          name: "FlashKit ${{ github.event_name == 'push' && github.ref_name || needs.bump-version.outputs.tag_name }}"
          tag_name: ${{ github.event_name == 'push' && github.ref_name || needs.bump-version.outputs.tag_name }}
          generate_release_notes: true

  build-assets:
    needs:
      - bump-version
      - create-release
    if: always() && needs.create-release.result == 'success'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || needs.bump-version.outputs.tag_name }}
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf \
            rpm \
            libudev-dev
      - name: install frontend dependencies
        working-directory: ./bow-rust
        run: npm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./bow-rust
          tagName: ${{ github.event_name == 'push' && github.ref_name || needs.bump-version.outputs.tag_name }}
          releaseName: "FlashKit ${{ github.event_name == 'push' && github.ref_name || needs.bump-version.outputs.tag_name }}"
          releaseDraft: ${{ github.event_name == 'push' && false || inputs.draft }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          args: ${{ matrix.platform == 'windows-latest' && '--bundles nsis' || '--bundles deb,rpm,appimage' }}
